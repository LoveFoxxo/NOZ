load_module /tmp/nginx-hardening-20261123/src/nginx-1.31.9/objs/ngx_http_safety_test_module.so;
worker_processes 1;
pid /tmp/nginx-hardening-20261123/runtime/nginx.pid;

events {
    worker_connections 256;
}

http {
    default_type application/octet-stream;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-hardening-20261123/runtime/temp;
    proxy_temp_path /tmp/nginx-hardening-20261123/runtime/temp;
    fastcgi_temp_path /tmp/nginx-hardening-20261123/runtime/temp;
    uwsgi_temp_path /tmp/nginx-hardening-20261123/runtime/temp;
    scgi_temp_path /tmp/nginx-hardening-20261123/runtime/temp;

    server {
        listen 18080;
        listen 18443 ssl;
        listen 18443 quic reuseport;

        http2 on;
        http3 on;

        ssl_certificate /tmp/nginx-hardening-20261123/runtime/cert.pem;
        ssl_certificate_key /tmp/nginx-hardening-20261123/runtime/key.pem;
        ssl_protocols TLSv1.3;

        location = /normal { safety_test normal; }
        location = /direct-503 { safety_test direct-503; }
        location = /pool-overflow { safety_test pool-overflow; }
        location = /array-overflow { safety_test array-overflow; }
        location = /list-overflow { safety_test list-overflow; }
        location = /thread-overflow { safety_test thread-overflow; }
        location = /header-overflow { safety_test header-overflow; }
    }
}
